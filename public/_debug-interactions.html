<!DOCTYPE html><html lang="en"><head><link rel="stylesheet" href="/css/style.css"></head>
<body class="roster-builder-body">
<main class="page roster-builder-page" data-event-id="123">
<header class="dashboard-header"><div><h1>Debug</h1><p id="event-time"></p></div><button id="save-roster" class="action-button action-button--primary">Save Roster</button></header><p id="roster-message" class="save-confirm" hidden></p>
<div class="roster-builder-layout">
<aside class="dashboard-panel player-column">
<div class="panel-heading"><div><p class="eyebrow">Player List</p><h2>2 signed up</h2></div></div>
<input class="member-search" id="player-search" type="search" placeholder="Search players..." />
<div class="role-filter" id="role-filter"><button data-role="all" class="active">All</button><button data-role="infantry">Infantry</button></div>
<div class="player-list drag-drop-container" id="player-list"></div>
</aside>
<section class="dashboard-panel squad-column">
<div class="squad-topbar"><div><p class="eyebrow">Squad Builder</p><h2>Build team</h2></div><div><strong id="slot-counter">0 / 5</strong><span> players assigned</span></div></div>
<div class="warning-banner" id="slot-warning" hidden></div>
<div class="template-bar" id="template-bar"><button data-template="infantry"><img src="/images/infantry.png" alt="" />Infantry</button><button data-template="armour"><img src="/images/armour.png" alt="" />Armour</button><button data-template="antiAir"><img src="/images/AAGun.png" alt="" />Anti-Air</button><button data-template="fob"><img src="/images/FOB.png" alt="" />FOB</button><button data-template="pilot"><img src="/images/pilot.png" alt="" />Pilot</button><button data-template="recon"><img src="/images/recon.png" alt="" />Recon</button><button data-template="commander"><img src="/images/wardogs.png" alt="" />Commander</button></div>
<p class="slot-remaining" id="slot-remaining"></p>
<div class="squad-list-scroll"><div id="squad-list" class="squad-list drag-drop-container"></div></div>
</section>
</div>
</main>
<script>
window.rosterBootstrap = { event: { id: '123', name: 'Test', startTime: Math.floor(Date.now()/1000), discordPosted: false, players: [
  { id: 'p1', name: 'Alpha', role: 'infantry', confirmation: 'confirmed' },
  { id: 'p2', name: 'Bravo', role: 'armour', confirmation: 'pending' },
] }, savedRoster: null };
</script>
<script src="/js/roster-builder.js"></script>
</body></html>
