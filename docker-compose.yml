services:
  wardogs-dash:
    build: .
    container_name: wardogs-dash
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Host networking makes 127.0.0.1 inside the container mean the VPS itself, so RCON_HOST=127.0.0.1
    # (the default) reaches a game server bound to localhost, and a reverse proxy on the host can
    # just proxy to localhost:3000. If you'd rather use normal Docker networking instead, remove this,
    # add `ports: ["127.0.0.1:3000:3000"]`, and point RCON_HOST at host.docker.internal (with an
    # `extra_hosts: ["host.docker.internal:host-gateway"]` entry) instead of 127.0.0.1.
    network_mode: host

  caddy:
    image: caddy:2-alpine
    container_name: wardogs-caddy
    restart: unless-stopped
    # Host networking so Caddy can bind the VPS's real :80/:443 and reach the app at 127.0.0.1:3000.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
