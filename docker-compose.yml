services:
  wardogs-dash:
    build: .
    container_name: wardogs-dash
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Host networking lets Caddy on this same box reach the app at 127.0.0.1:<PORT>, and lets the
    # app reach a local RCON server via 127.0.0.1 if you ever run one on this VPS. It also means
    # this app shares one port space with everything else on the box — set a free PORT in .env
    # (see .env.example) and match it in Caddyfile's reverse_proxy line. If you'd rather use normal
    # Docker networking instead, remove this and add `ports: ["127.0.0.1:<PORT>:<PORT>"]`.
    network_mode: host

  caddy:
    image: caddy:2-alpine
    container_name: wardogs-caddy
    restart: unless-stopped
    # Host networking so Caddy can bind the VPS's real :80/:443 and reach the app at 127.0.0.1:<PORT>
    # (whatever PORT is set to in .env / Caddyfile).
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
